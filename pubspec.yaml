name: secure_p2p_messenger
description: Portfolio demo by mcminox. Proprietary. MX-OWN-2026-SECURE-P2P-MESSENGER.
publish_to: "none"
version: 0.1.0
homepage: https://github.com/mcminox/secure-p2p-messenger
author: mcminox

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  file_picker: ^8.0.0+1
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  collection: ^1.18.0
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  mobile_scanner: ^6.0.2
  flutter_webrtc: ^1.4.1
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: assets/app_icon.png

msix_config:
  display_name: Dart AUT
  publisher_display_name: SecureP2P
  identity_name: com.securep2p.messenger
  msix_version: 1.0.1.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  install_certificate: true
  build_windows: false
